[project]
name = "zippie"
version = "0.1.0"
description = "Graph Transformer Multi-Agent Reinforcement Learning for UAV Navigation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "tensorboard>=2.16.0",
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]